<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
<title>2026 경기 티볼 도대회 · 중등부</title>
<link rel="icon" href="../shared/favicon.ico" />
<link rel="apple-touch-icon" href="../shared/apple-touch-icon.png" />
<link rel="stylesheet" href="../shared/style.css?v=23" />
</head>
<body>

<header class="site-header">
  <p class="eyebrow">2026 경기학교스포츠클럽축제 · 티볼</p>
  <h1 id="levelTitle">중등부</h1>
  <div class="gender-toggle" id="genderToggle"></div>
  <button class="venue-btn" id="venueBtn">📍 구장위치 보기</button>
</header>

<div class="venue-modal" id="venueModal">
  <div class="venue-modal-inner">
    <button class="venue-close" id="venueClose">✕</button>
    <h2>화성드림파크 야구장 구장 위치</h2>
    <p class="venue-hint">사진을 누르면 새 탭에서 크게(확대) 볼 수 있어요</p>
    <a href="../shared/venue/venue-1-overview.png" target="_blank" rel="noopener"><img src="../shared/venue/venue-1-overview.png" alt="전체 조감도" /></a>
    <p class="venue-caption">전체 조감도 — 대회장소(2곳) 위치</p>
    <a href="../shared/venue/venue-2-abc.png" target="_blank" rel="noopener"><img src="../shared/venue/venue-2-abc.png" alt="A~C구장 조감도" /></a>
    <p class="venue-caption">A·B·C구장 세부 조감도</p>
    <a href="../shared/venue/venue-3-de.png" target="_blank" rel="noopener"><img src="../shared/venue/venue-3-de.png" alt="D~E구장 조감도" /></a>
    <p class="venue-caption">D·E구장 세부 조감도</p>
  </div>
</div>

<nav class="view-tabs">
  <button data-view="schedule" class="active">시간표</button>
  <button data-view="standings">예선 순위표</button>
  <button data-view="bracket">본선 토너먼트</button>
</nav>

<main>
  <section id="view-schedule" class="view active">
    <div class="day-tabs" id="dayTabs"></div>
    <div id="scheduleTable"></div>
  </section>

  <section id="view-standings" class="view">
    <div id="standingsWrap"></div>
  </section>

  <section id="view-bracket" class="view">
    <div id="bracketWrap"></div>
  </section>
</main>

<!-- Firebase (실시간 스코어 반영용) -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="../shared/firebase-config.js?v=23"></script>

<script src="../shared/teams-middle.js?v=23"></script>
<script src="../shared/schedule.js?v=23"></script>
<script src="../shared/standings.js?v=23"></script>
<script src="../shared/render.js?v=23"></script>
<script>
  initApp({
    key: "middle",
    label: "중등부",
    accent: "#b5502a",
    teamsData: TEAMS_MIDDLE,
    defaultGender: "m",
  });
</script>
</body>
</html>
