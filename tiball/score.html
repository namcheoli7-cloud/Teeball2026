<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
<title>티볼 도대회 · 스코어 입력</title>
<link rel="stylesheet" href="shared/style.css" />
<style>
  :root { --accent: #1c211d; }
  .site-header h1 { font-size: 20px; }
</style>
</head>
<body>

<header class="site-header">
  <p class="eyebrow">2026 경기학교스포츠클럽축제 · 티볼</p>
  <h1>구장 스코어 입력</h1>
</header>

<div class="score-wrap">
  <p style="font-size:13px; color:#565b53; margin-top:14px;">일자 → 구장 → 경기 시간 순으로 선택하면 해당 경기 스코어를 입력할 수 있습니다.</p>

  <div class="picker-row" id="dayPicker"></div>
  <div class="picker-row" id="courtPicker"></div>
  <div class="picker-row" id="timePicker"></div>

  <div id="matchArea"></div>
</div>

<div class="toast" id="toast"></div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="shared/firebase-config.js"></script>

<script src="shared/teams-elementary.js"></script>
<script src="shared/teams-middle.js"></script>
<script src="shared/schedule.js"></script>

<script>
const LEVEL_LABEL = { elementary: "초등부", middle: "중등부", skip: "여고부(별도)" };
const GENDER_LABEL = { m: "남자", f: "여자" };
const COURTS = ["A", "B", "C", "D", "E"];

function teamsDataFor(level, gender) {
  const src = level === "elementary" ? TEAMS_ELEMENTARY : level === "middle" ? TEAMS_MIDDLE : null;
  if (!src) return null;
  return src[gender === "m" ? "male" : "female"];
}
function teamName(level, gender, id) {
  const td = teamsDataFor(level, gender);
  if (!td) return "";
  const t = td.teams.find((x) => x.id === id);
  return t ? t.name : "";
}

const state = { day: 1, court: "A", time: null };

function renderDayPicker() {
  const el = document.getElementById("dayPicker");
  el.innerHTML = "";
  [1, 2].forEach((d) => {
    const b = document.createElement("button");
    b.textContent = d === 1 ? "9/5(토) 1일차" : "9/6(일) 2일차";
    b.className = d === state.day ? "active" : "";
    b.onclick = () => { state.day = d; state.time = null; renderAll(); };
    el.appendChild(b);
  });
}

function renderCourtPicker() {
  const el = document.getElementById("courtPicker");
  el.innerHTML = "";
  COURTS.forEach((c) => {
    const b = document.createElement("button");
    b.textContent = c + "구장";
    b.className = c === state.court ? "active" : "";
    b.onclick = () => { state.court = c; state.time = null; renderAll(); };
    el.appendChild(b);
  });
}

function matchesForDayCourt() {
  return SCHEDULE.filter((m) => m.day === state.day && m.court === state.court).sort((a, b) => a.time.localeCompare(b.time));
}

function renderTimePicker() {
  const el = document.getElementById("timePicker");
  el.innerHTML = "";
  const matches = matchesForDayCourt();
  if (matches.length === 0) {
    el.innerHTML = '<div class="empty-state">이 구장에는 경기가 없습니다.</div>';
    return;
  }
  if (!state.time) state.time = matches[0].time;
  matches.forEach((m) => {
    const b = document.createElement("button");
    b.textContent = m.time;
    b.className = m.time === state.time ? "active" : "";
    b.onclick = () => { state.time = m.time; renderMatchArea(); syncTimeButtons(); };
    el.appendChild(b);
  });
}
function syncTimeButtons() {
  [...document.getElementById("timePicker").children].forEach((b) => b.classList.toggle("active", b.textContent === state.time));
}

function currentMatch() {
  return matchesForDayCourt().find((m) => m.time === state.time);
}

let liveScore = { score1: 0, score2: 0, innings1: 3, innings2: 3, status: "progress" };
let freeNames = { team1: "", team2: "" };

function renderMatchArea() {
  const m = currentMatch();
  const area = document.getElementById("matchArea");
  if (!m) { area.innerHTML = ""; return; }

  if (m.level === "skip") {
    area.innerHTML = `<div class="match-card"><div class="label">${GENDER_LABEL[m.gender]}부 · ${m.stageLabel || ""}</div>
      <p style="font-size:14px;">여고부는 이 도구가 아닌 별도 방식으로 관리됩니다. (${m.slotLabel || ""})</p></div>`;
    return;
  }

  const isGroup = m.stage === "group";
  const t1Name = isGroup ? teamName(m.level, m.gender, m.team1) : (freeNames.team1 || "");
  const t2Name = isGroup ? teamName(m.level, m.gender, m.team2) : (freeNames.team2 || "");

  db.ref(`${SCORES_PATH}/${m.id}`).once("value").then((snap) => {
    const existing = snap.val();
    liveScore = existing || { score1: 0, score2: 0, innings1: 3, innings2: 3, status: "progress" };
    if (!isGroup && existing) {
      freeNames.team1 = existing.team1Name || "";
      freeNames.team2 = existing.team2Name || "";
    }
    paintMatchCard(m, isGroup);
  });
}

function paintMatchCard(m, isGroup) {
  const area = document.getElementById("matchArea");
  const td = teamsDataFor(m.level, m.gender);
  const datalistId = "teamlist-" + m.level + "-" + m.gender;
  let datalistHtml = "";
  if (td) {
    datalistHtml = `<datalist id="${datalistId}">` + td.teams.map((t) => `<option value="${t.name}">`).join("") + `</datalist>`;
  }

  const nameFieldsHtml = isGroup
    ? `<div class="score-row"><span class="team-name">${teamName(m.level, m.gender, m.team1)}</span></div>`
    : `<input class="free-team-select" list="${datalistId}" placeholder="팀1 이름 입력" id="freeTeam1" value="${freeNames.team1 || ""}" />`;
  const nameFieldsHtml2 = isGroup ? "" : `<input class="free-team-select" list="${datalistId}" placeholder="팀2 이름 입력" id="freeTeam2" value="${freeNames.team2 || ""}" />`;

  area.innerHTML = `
    <div class="match-card">
      <div class="label">${LEVEL_LABEL[m.level]} · ${GENDER_LABEL[m.gender]}부 ${m.groupId ? "· " + m.groupId + "조" : ""} ${m.stageLabel ? "· " + m.stageLabel : ""} ${m.note ? "· " + m.note : ""}</div>
      ${datalistHtml}
      ${!isGroup ? nameFieldsHtml + nameFieldsHtml2 : ""}
      <div class="score-row">
        <span class="team-name" id="label1">${isGroup ? teamName(m.level, m.gender, m.team1) : (freeNames.team1 || "팀1")}</span>
        <div class="stepper">
          <button onclick="bumpScore(1,-1)">−</button>
          <span class="num" id="score1">${liveScore.score1}</span>
          <button onclick="bumpScore(1,1)">＋</button>
        </div>
      </div>
      <div class="score-row">
        <span class="team-name" id="label2">${isGroup ? teamName(m.level, m.gender, m.team2) : (freeNames.team2 || "팀2")}</span>
        <div class="stepper">
          <button onclick="bumpScore(2,-1)">−</button>
          <span class="num" id="score2">${liveScore.score2}</span>
          <button onclick="bumpScore(2,1)">＋</button>
        </div>
      </div>
      <div class="innings-row">
        진행 이닝 &nbsp;팀1 <input type="number" id="innings1" value="${liveScore.innings1}" min="1" max="3" />
        &nbsp;팀2 <input type="number" id="innings2" value="${liveScore.innings2}" min="1" max="3" />
      </div>
      <div class="status-row">
        <button id="btnProgress" class="${liveScore.status === "progress" ? "active" : ""}" onclick="setStatus('progress')">진행중</button>
        <button id="btnFinal" class="${liveScore.status === "final" ? "active" : ""}" onclick="setStatus('final')">경기 종료</button>
      </div>
      <button class="save-btn" onclick="saveScore('${m.id}', ${isGroup})">저장</button>
    </div>
  `;
}

function bumpScore(which, delta) {
  const key = "score" + which;
  liveScore[key] = Math.max(0, (liveScore[key] || 0) + delta);
  document.getElementById(key).textContent = liveScore[key];
}
function setStatus(s) {
  liveScore.status = s;
  document.getElementById("btnProgress").classList.toggle("active", s === "progress");
  document.getElementById("btnFinal").classList.toggle("active", s === "final");
}

function saveScore(matchId, isGroup) {
  liveScore.innings1 = Number(document.getElementById("innings1").value) || 3;
  liveScore.innings2 = Number(document.getElementById("innings2").value) || 3;

  const payload = { ...liveScore, updatedAt: Date.now() };
  if (!isGroup) {
    payload.team1Name = document.getElementById("freeTeam1") ? document.getElementById("freeTeam1").value : "";
    payload.team2Name = document.getElementById("freeTeam2") ? document.getElementById("freeTeam2").value : "";
  }
  db.ref(`${SCORES_PATH}/${matchId}`).set(payload).then(() => showToast("저장되었습니다"));
}

function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 1600);
}

function renderAll() {
  renderDayPicker();
  renderCourtPicker();
  renderTimePicker();
  renderMatchArea();
}
renderAll();
</script>
</body>
</html>
