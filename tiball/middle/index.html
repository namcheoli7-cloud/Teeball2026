<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
<title>2026 경기 티볼 도대회 · 중등부</title>
<link rel="stylesheet" href="../shared/style.css" />
</head>
<body>

<header class="site-header">
  <p class="eyebrow">2026 경기학교스포츠클럽축제 · 티볼</p>
  <h1 id="levelTitle">중등부</h1>
  <div class="gender-toggle" id="genderToggle"></div>
</header>

<nav class="view-tabs">
  <button data-view="schedule" class="active">시간표</button>
  <button data-view="standings">예선 순위표</button>
  <button data-view="bracket">토너먼트</button>
</nav>

<main>
  <section id="view-schedule" class="view active">
    <div class="day-tabs" id="dayTabs"></div>
    <div id="scheduleTable"></div>
  </section>

  <section id="view-standings" class="view">
    <div id="standingsWrap"></div>
  </section>

  <section id="view-bracket" class="view">
    <div id="bracketWrap"></div>
  </section>
</main>

<!-- Firebase (실시간 스코어 반영용) -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="../shared/firebase-config.js"></script>

<script src="../shared/teams-middle.js"></script>
<script src="../shared/schedule.js"></script>
<script src="../shared/standings.js"></script>
<script src="../shared/render.js"></script>
<script>
  initApp({
    key: "middle",
    label: "중등부",
    accent: "#b5502a",
    teamsData: TEAMS_MIDDLE,
  });
</script>
</body>
</html>
